name: teen_patti_gold
description: Teen Patti Gold - India's #1 Card Game App
publish_to: 'none'
version: 5.4.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  audioplayers: ^6.0.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  curved_navigation_bar: ^1.0.3
  confetti: ^0.7.0
  simple_animations: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
