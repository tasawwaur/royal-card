<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="fire-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="water-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="25%" stop-color="#FFAE00"/>
      <stop offset="50%" stop-color="#FFF5C0"/>
      <stop offset="75%" stop-color="#D48800"/>
      <stop offset="100%" stop-color="#8B5200"/>
    </linearGradient>

    <!-- Water Fall Animated Stream Gradient -->
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#06B6D4;#38BDF8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.95">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#0284C7;#3B82F6;#0284C7" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Fire Flame Aura Gradient -->
    <radialGradient id="fireRing" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#FF4500" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFA500" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Fire Flame Aura Pulsing -->
  <circle cx="200" cy="200" r="175" fill="url(#fireRing)" filter="url(#fire-glow)">
    <animate attributeName="opacity" values="0.5;1;0.6;0.95;0.5" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Outer 24K Gold Braided Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#goldGrad1)" stroke-width="14" filter="url(#gold-glow)" />

  <!-- 🌊 WATER FALL ANIMATED CASCADING RINGS 🌊 -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#waterFlow)" stroke-width="6" stroke-dasharray="40 25 15 30" filter="url(#water-glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="200" r="144" fill="none" stroke="#E0F2FE" stroke-width="2.5" stroke-dasharray="12 12" opacity="0.95">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- 💧 Cascading Waterfall Droplets Flowing Downwards 💧 -->
  <g>
    <circle cx="65" cy="120" r="3.5" fill="#E0F2FE" filter="url(#water-glow)">
      <animate attributeName="cy" values="100;300;100" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="120" r="3.5" fill="#E0F2FE" filter="url(#water-glow)">
      <animate attributeName="cy" values="100;300;100" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="50" r="4" fill="#38BDF8" filter="url(#water-glow)">
      <animate attributeName="cy" values="50;350;50" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 🔥 FIRE FLAME SPARKS & FLOATING EMBERS 🔥 -->
  <g filter="url(#fire-glow)">
    <!-- Ascending Fire Embers Left -->
    <circle cx="75" cy="340" r="3" fill="#FF4500">
      <animate attributeName="cy" values="340;60;340" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="75;55;75" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Ascending Fire Embers Right -->
    <circle cx="325" cy="340" r="3" fill="#FFA500">
      <animate attributeName="cy" values="340;60;340" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="325;345;325" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Ascending Fire Embers Center -->
    <circle cx="200" cy="360" r="4" fill="#FFD700">
      <animate attributeName="cy" values="360;40;360" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ornate Golden Wing Accents - Left & Right -->
  <g transform="translate(200, 200)">
    <!-- Left Wing -->
    <path d="M -155 -20 Q -195 -85 -140 -125 Q -110 -105 -125 -40 Z" fill="url(#goldGrad1)" filter="url(#gold-glow)" />
    <path d="M -145 -30 Q -175 -80 -135 -110 Q -110 -90 -120 -45 Z" fill="#FFE79A" />
    
    <!-- Right Wing -->
    <path d="M 155 -20 Q 195 -85 140 -125 Q 110 -105 125 -40 Z" fill="url(#goldGrad1)" filter="url(#gold-glow)" />
    <path d="M 145 -30 Q 175 -80 135 -110 Q 110 -90 120 -45 Z" fill="#FFE79A" />
  </g>

  <!-- Imperial Crown Crest at Top -->
  <g transform="translate(200, 32)">
    <path d="M -48 28 L -38 -18 L -16 6 L 0 -28 L 16 6 L 38 -18 L 48 28 Z" fill="url(#goldGrad1)" filter="url(#gold-glow)" />
    <circle cx="0" cy="-28" r="8" fill="url(#gemGrad)" />
    <circle cx="-38" cy="-18" r="6" fill="url(#gemGrad)" />
    <circle cx="38" cy="-18" r="6" fill="url(#gemGrad)" />
    <circle cx="0" cy="6" r="9" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Bottom VIP Medallion Badge -->
  <g transform="translate(200, 365)">
    <path d="M -45 -18 L 45 -18 L 32 18 L -32 18 Z" fill="url(#goldGrad1)" filter="url(#gold-glow)" />
    <text x="0" y="6" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="14" fill="#3B0764" text-anchor="middle" letter-spacing="2">ROYAL VIP</text>
  </g>

  <!-- Embedded Corner Gems with Fire Sparkle -->
  <circle cx="62" cy="200" r="11" fill="url(#gemGrad)" filter="url(#gold-glow)" />
  <circle cx="62" cy="200" r="5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="338" cy="200" r="11" fill="url(#gemGrad)" filter="url(#gold-glow)" />
  <circle cx="338" cy="200" r="5" fill="#FFFFFF" opacity="0.9" />

  <!-- Sparkling Gold Stars -->
  <path d="M 80 75 L 84 87 L 96 91 L 84 95 L 80 107 L 76 95 L 64 91 L 76 87 Z" fill="#FFF5C0" filter="url(#gold-glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M 320 75 L 324 87 L 336 91 L 324 95 L 320 107 L 316 95 L 304 91 L 316 87 Z" fill="#FFF5C0" filter="url(#gold-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
